name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      preview_pr:
        description: "PR number to publish under /previews/pr-<number>/; leave blank for main only"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Upload main build for preview
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.preview_pr != ''
        uses: actions/upload-artifact@v4
        with:
          name: main-build
          path: dist
          if-no-files-found: error
          retention-days: 1

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || github.event.inputs.preview_pr == '')
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy-preview:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.preview_pr != ''
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}previews/pr-${{ github.event.inputs.preview_pr }}/
    steps:
      - name: Validate pull request number
        env:
          PR_NUMBER: ${{ github.event.inputs.preview_pr }}
        run: |
          if ! [[ "${PR_NUMBER}" =~ ^[0-9]+$ ]]; then
            echo "::error::preview_pr must be a pull request number"
            exit 1
          fi

      - name: Checkout PR merge commit
        uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ github.event.inputs.preview_pr }}/merge
          path: preview-source

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: preview-source/package-lock.json

      - name: Build PR preview
        working-directory: preview-source
        run: |
          npm ci
          npm run build

      - name: Download main build
        uses: actions/download-artifact@v4
        with:
          name: main-build
          path: main-build

      - name: Combine main and preview builds
        env:
          PR_NUMBER: ${{ github.event.inputs.preview_pr }}
        run: |
          mkdir -p "site/previews/pr-${PR_NUMBER}"
          cp -R main-build/. site/
          cp -R preview-source/dist/. "site/previews/pr-${PR_NUMBER}/"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy preview to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || github.event.inputs.preview_pr == '')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
