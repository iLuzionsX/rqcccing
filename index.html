<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>RQCCCING</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect fill='%23111618' width='16' height='16'/%3E%3Cpath d='M2 12 L8 3 L14 12' fill='none' stroke='%23ffb15a' stroke-width='1.6'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500&family=Oswald:wght@500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <section id="title">
      <p class="eyebrow">GOLDEN HOUR GP</p>
      <h1>RQCCCING</h1>
      <p class="lede">Three laps around a wet coastal circuit. The sun is low, the lake is glass, and the asphalt still holds the rain.</p>
      <button class="drive" id="start" type="button">Drive</button>
      <p class="keys">Steer A D · throttle W · brake S · handbrake Space · camera C · reset R</p>
    </section>

    <div id="hud" class="hidden">
      <div id="stats">
        <div><span>LAP</span><strong id="lap">1 / 3</strong></div>
        <div><span>POS</span><strong id="place">1st</strong></div>
        <div><span>TIME</span><strong id="time">0:00.000</strong></div>
        <div><span>BEST</span><strong id="best">--:--.---</strong></div>
      </div>
      <div id="speed-wrap">
        <div>
          <div id="speed">0</div>
          <small>KM/H</small>
        </div>
        <div id="gear">N</div>
      </div>
      <canvas id="minimap" width="180" height="180"></canvas>
      <div id="countdown" class="hidden"></div>
      <div id="warning" class="hidden">WRONG WAY</div>
    </div>

    <section id="results" class="hidden">
      <article>
        <p class="eyebrow">CHECKERED FLAG</p>
        <h2>FINISH</h2>
        <div id="result-body"></div>
        <button id="again" type="button">Drive again</button>
      </article>
    </section>

    <div id="touch">
      <button id="left" type="button">L</button>
      <button id="right" type="button">R</button>
      <button id="brake" type="button">BRAKE</button>
      <button id="gas" type="button">GAS</button>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
